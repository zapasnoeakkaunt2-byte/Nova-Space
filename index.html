<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVA SPACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; margin: 0; overflow: hidden; height: 100vh; }
        .tg-sidebar { background: #1e293b; border-right: 1px solid rgba(255,255,255,0.1); }
        .chat-bg { background: #0f172a; background-image: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%); }
        .message-in { background: #1e293b; border-radius: 18px 18px 18px 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .message-out { background: #3b82f6; border-radius: 18px 18px 4px 18px; box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3); }
        .glass-input { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex flex-col md:flex-row">

    <aside id="sidebar" class="w-full md:w-80 tg-sidebar flex flex-col h-full z-20">
        <div class="p-4 flex items-center justify-between border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center font-bold text-xl">N</div>
                <span class="font-bold text-lg">Nova Space</span>
            </div>
            <button onclick="updateNickname()" class="text-slate-400">⚙️</button>
        </div>
        
        <div class="flex-1 overflow-y-auto">
            <div class="p-4 flex items-center gap-3 hover:bg-white/5 cursor-pointer transition border-l-4 border-blue-500 bg-blue-500/10">
                <div class="w-12 h-12 bg-gradient-to-tr from-purple-500 to-blue-500 rounded-full flex items-center justify-center text-sm font-bold">OC</div>
                <div class="flex-1 min-w-0">
                    <div class="flex justify-between">
                        <span class="font-semibold truncate">Общий Чат</span>
                        <span class="text-xs text-slate-500">15:30</span>
                    </div>
                    <p class="text-sm text-slate-400 truncate">Добро пожаловать в Нову!</p>
                </div>
            </div>
        </div>
    </aside>

    <main id="chatScreen" class="flex-1 flex flex-col h-full chat-bg relative hidden">
        <header class="p-3 glass-input flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <button class="md:hidden" onclick="toggleSidebar()">⬅️</button>
                <div>
                    <h2 class="font-bold">Общий Чат</h2>
                    <p class="text-[10px] text-blue-400 uppercase tracking-widest font-bold" id="userStatus">OFFLINE</p>
                </div>
            </div>
            <div class="flex gap-4 opacity-50">
                <span>🔍</span><span>📞</span><span>⋮</span>
            </div>
        </header>

        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
            </div>

        <footer class="p-4 relative">
            <div class="max-w-4xl mx-auto flex items-center gap-2 glass-input p-2 rounded-2xl">
                <button class="p-2 text-2xl hover:bg-white/5 rounded-full transition">📎</button>
                <input type="text" id="msgInput" placeholder="Написать сообщение..." 
                       class="flex-1 bg-transparent border-none focus:outline-none text-white px-2">
                <button class="p-2 text-2xl">😊</button>
                <button onclick="send()" class="bg-blue-600 p-3 rounded-xl hover:scale-110 active:scale-90 transition-all">
                    <svg class="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </footer>
    </main>

    <div id="authScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#0f172a] p-6">
        <div class="w-full max-w-sm space-y-8 text-center">
            <div class="w-24 h-24 bg-blue-600 mx-auto rounded-3xl flex items-center justify-center text-5xl font-black italic shadow-2xl shadow-blue-500/50">N</div>
            <h1 class="text-3xl font-black uppercase tracking-tighter italic">Nova Space</h1>
            <div class="space-y-4">
                <input type="email" id="emailInput" placeholder="Введите ваш email" 
                       class="w-full bg-slate-800 border border-slate-700 rounded-2xl px-5 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-lg hover:bg-blue-500 transition-all shadow-xl shadow-blue-600/20">
                    Начать общение
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
