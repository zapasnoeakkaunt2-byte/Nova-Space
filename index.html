<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA SPACE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #020617; color: white; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-text { text-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
    </style>
</head>
<body class="h-screen flex flex-col font-sans">

    <header class="p-4 flex justify-between items-center glass m-2 rounded-2xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20 font-black italic text-2xl">N</div>
            <div>
                <h1 class="text-xl font-black tracking-tighter leading-none neon-text">NOVA SPACE</h1>
                <button onclick="updateNickname()" id="userStatus" class="text-[10px] text-blue-400 font-bold tracking-widest hover:text-white transition uppercase">
                    OFFLINE
                </button>
            </div>
        </div>
        <button id="loginBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-full text-sm font-bold transition-all active:scale-95 shadow-lg shadow-blue-600/30">
            Войти через Google
        </button>
    </header>

    <main class="flex-1 flex overflow-hidden p-2 gap-2">
        <aside class="hidden md:flex w-72 glass rounded-2xl flex-col p-4">
            <h2 class="text-slate-400 text-xs font-bold mb-4 uppercase">Твои чаты</h2>
            <div class="space-y-2">
                <div class="p-3 bg-blue-600/10 border border-blue-500/30 rounded-xl text-sm">Общий чат Nova 🇷🇺</div>
                <div class="p-3 glass rounded-xl text-sm text-slate-400 hover:text-white cursor-pointer transition">DeepSeek AI 🤖</div>
            </div>
        </aside>

        <section class="flex-1 glass rounded-2xl flex flex-col overflow-hidden">
            <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex flex-col items-center justify-center h-full text-center space-y-4">
                    <div class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center animate-pulse">
                        <svg class="w-10 h-10 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                    </div>
                    <h2 class="text-xl font-bold">Добро пожаловать в Nova Space</h2>
                    <p class="text-slate-400 text-sm max-w-xs">Чтобы писать реальным людям и ИИ, нужно нажать на кнопку сверху!</p>
                </div>
            </div>

            <div class="p-4 bg-slate-900/50">
                <div class="flex gap-2 items-center max-w-4xl mx-auto">
                    <input type="text" id="msgInput" placeholder="Введите сообщение..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all">
                    <button class="bg-blue-600 p-3 rounded-xl hover:scale-105 active:scale-95 transition-all">
                        <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const supabaseUrl = 'https://utpozwhjvzhsonbkemlq.supabase.co'
        const supabaseKey = 'sb_publishable_uiOs8EoSqyydQxiV3WSbrQ_pYCVXJJ6'
        const supabase = supabase.createClient(supabaseUrl, supabaseKey)

        // Функция входа
        async function handleLogin() {
            const email = document.getElementById('emailInput').value
            const { error } = await supabase.auth.signInWithOtp({ email })
            if (error) alert(error.message)
            else alert('Ссылка для входа отправлена на почту!')
        }

        // ФУНКЦИЯ ИЗМЕНЕНИЯ ИМЕНИ
        async function updateNickname() {
            const newName = prompt("Как тебя называть в Nova Space?")
            if (!newName) return

            const { data, error } = await supabase.auth.updateUser({
                data: { display_name: newName }
            })

            if (error) alert("Ошибка: " + error.message)
            else {
                alert("Имя изменено на: " + newName)
                location.reload() // Перезагрузим, чтобы имя обновилось везде
            }
        }

        // Следим за входом пользователя
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                document.getElementById('authScreen').classList.add('hidden')
                document.getElementById('chatScreen').classList.remove('hidden')
                
                // Берем имя из данных пользователя
                const userName = session.user.user_metadata.display_name || "Новичок Nova"
                document.getElementById('userStatus').innerText = userName.toUpperCase()
                
                // Если имени еще нет — попросим ввести
                if (!session.user.user_metadata.display_name) {
                    updateNickname()
                }
            }
        })
    </script>
</body>
</html>
